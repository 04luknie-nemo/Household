name: Server

on:
  pull_request:
    branches: [main]
    paths:
      - server/**
      - .prettierrc.json
      - .github/workflows/server.yml

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run db:generate
      - run: npx tsc --noEmit
      - run: npx prettier@3.8.1 --check "src/**/*.ts" "prisma/*.ts"
