name: Mobile

on:
  pull_request:
    branches: [main]
    paths:
      - mobile/**
      - .github/workflows/mobile.yml

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx expo lint
      - run: npx tsc --noEmit
